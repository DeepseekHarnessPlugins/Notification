<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- dsh-task-notify v0.2 icon: goal-completed（目标达成）— 几何与 scripts/build-icons.mjs 中 ICONS["goal-completed"] 锁定一致 -->
  <!-- 底圆：圆心 (32,32) r=25；同心圆靶：外环 r=13 stroke 5.5 不填充 + 内实心点 r=5.25 -->
