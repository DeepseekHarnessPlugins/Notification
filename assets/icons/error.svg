<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- dsh-task-notify v0.2 icon: error（任务出错）— 几何与 scripts/build-icons.mjs 中 ICONS.error 锁定一致 -->
  <!-- 底圆：圆心 (32,32) r=25；叉：两条交叉线段 (22.5,22.5)<->(41.5,41.5) 与 (41.5,22.5)<->(22.5,41.5)，stroke 6 圆头 -->
  <circle cx="32" cy="32" r="25" fill="#FF3B30"/>
  <line x1="22.5" y1="22.5" x2="41.5" y2="41.5" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="41.5" y1="22.5" x2="22.5" y2="41.5" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
</svg>
